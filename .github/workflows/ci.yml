name: CI Build & Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2 UCRT64
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-binutils
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-libplist
          mingw-w64-ucrt-x86_64-json-glib
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-gstreamer
          mingw-w64-ucrt-x86_64-gst-plugins-base
          mingw-w64-ucrt-x86_64-gst-plugins-good
          mingw-w64-ucrt-x86_64-gst-plugins-bad
          mingw-w64-ucrt-x86_64-gst-libav

    - name: Build Native UxPlay Core Engine
      shell: msys2 {0}
      run: |
        cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build core/build

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore UxPlayDesktop.sln

    - name: Build Solution
      run: dotnet build UxPlayDesktop.sln -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test UxPlayDesktop.sln -c Release --no-build --verbosity normal

    - name: Package Desktop Artifacts
      shell: pwsh
      run: .\build.ps1 -Action package -Configuration Release

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UxPlayDesktop-win-x64
        path: out/artifacts/UxPlayDesktop-win-x64.zip
        retention-days: 14

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: out/artifacts/UxPlayDesktop-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
