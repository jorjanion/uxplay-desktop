name: CI Build & Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            msystem: UCRT64
            packages: >-
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-binutils
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-libplist
              mingw-w64-ucrt-x86_64-json-glib
              mingw-w64-ucrt-x86_64-openssl
              mingw-w64-ucrt-x86_64-gstreamer
              mingw-w64-ucrt-x86_64-gst-plugins-base
              mingw-w64-ucrt-x86_64-gst-plugins-good
              mingw-w64-ucrt-x86_64-gst-plugins-bad
              mingw-w64-ucrt-x86_64-gst-libav
              mingw-w64-ucrt-x86_64-python
              mingw-w64-ucrt-x86_64-python-gobject
          - architecture: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            packages: >-
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-gcc-compat
              mingw-w64-clang-aarch64-libc++
              mingw-w64-clang-aarch64-llvm-tools
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-libplist
              mingw-w64-clang-aarch64-json-glib
              mingw-w64-clang-aarch64-openssl
              mingw-w64-clang-aarch64-gstreamer
              mingw-w64-clang-aarch64-gst-plugins-base
              mingw-w64-clang-aarch64-gst-plugins-good
              mingw-w64-clang-aarch64-gst-plugins-bad
              mingw-w64-clang-aarch64-gst-libav
              mingw-w64-clang-aarch64-python
              mingw-w64-clang-aarch64-python-gobject

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Inno Setup
      shell: powershell
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
          choco install innosetup --no-progress -y
        }

    - name: Setup MSYS2 ${{ matrix.msystem }}
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}

    - name: Build Native UxPlay Core Engine
      shell: msys2 {0}
      run: |
        cmake -S core -B core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build core/build

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore UxPlayDesktop.sln

    - name: Build Solution
      run: dotnet build UxPlayDesktop.sln -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test UxPlayDesktop.sln -c Release --no-build --verbosity normal

    - name: Package Desktop Artifacts
      shell: pwsh
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: .\build.ps1 -Action package -Architecture ${{ matrix.architecture }} -Configuration Release

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UxPlayDesktop-${{ matrix.architecture }}
        path: out/artifacts/*
        retention-days: 14

  release:
    name: Publish Release Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Flatten release artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Get-ChildItem -Path release-artifacts -Recurse -File | ForEach-Object {
          Copy-Item -LiteralPath $_.FullName -Destination dist\ -Force
        }
        Get-ChildItem -Path dist

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
